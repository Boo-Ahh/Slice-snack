var CONFIG_KEY = 'kaduba-config';   // admin-owned: store settings, catalog, password — customers never write this
var ORDERS_KEY = 'kaduba-orders';   // shared: orders + login log — customers and admin both append to this
var storageAvailable = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
var isSyncing = false;

function snapshotConfig(){
  return {
    storeName: state.storeName,
    storeDescription: state.storeDescription,
    contactPhone: state.contactPhone,
    contactEmail: state.contactEmail,
    address: state.address,
    paymentNumber: state.paymentNumber,
    pickupDays: state.pickupDays,
    deliveryDays: state.deliveryDays,
    adminPassword: state.adminPassword,
    currency: state.currency,
    sections: state.sections,
    products: state.products
  };
}

function applyConfig(data){
  if(!data) return;
  state.storeName = data.storeName || state.storeName;
  state.storeDescription = data.storeDescription || state.storeDescription;
  state.contactPhone = data.contactPhone || state.contactPhone;
  state.contactEmail = data.contactEmail || state.contactEmail;
  state.address = data.address || state.address;
  state.paymentNumber = data.paymentNumber || state.paymentNumber;
  state.pickupDays = data.pickupDays || state.pickupDays;
  state.deliveryDays = data.deliveryDays || state.deliveryDays;
  state.adminPassword = data.adminPassword || state.adminPassword;
  state.currency = data.currency || state.currency;
  state.sections = (data.sections && data.sections.length) ? data.sections : state.sections;
  state.products = (data.products && data.products.length) ? data.products : state.products;
}

function applyOrders(data){
  if(!data) return;
  state.orders = data.orders || [];
  state.customerLogins = data.customerLogins || [];
}

function mergeById(remote, local){
  remote = remote || [];
  local = local || [];
  var map = {};
  remote.forEach(function(item){ map[item.id] = item; });
  local.forEach(function(item){ map[item.id] = item; }); // local edits win for anything we touched
  return Object.keys(map).map(function(id){ return map[id]; });
}

function mergeLogins(remote, local){
  remote = remote || [];
  local = local || [];
  var seen = {};
  var combined = remote.concat(local);
  var out = [];
  combined.forEach(function(l){
    var key = l.email + '|' + l.timestamp;
    if(!seen[key]){ seen[key] = true; out.push(l); }
  });
  return out;
}

// Config (settings, catalog, password) is only ever written by admin actions, so it's
// safe to overwrite outright — no customer action is allowed to touch this key.
async function persistConfig(){
  if(!storageAvailable) return;
  try{
    await window.storage.set(CONFIG_KEY, JSON.stringify(snapshotConfig()), true);
  }catch(e){
    console.error('Could not save config to backend storage', e);
  }
}

// Orders/logins can be written by many customers at once, so we merge with whatever
// is currently stored instead of blindly overwriting it — nobody's order gets lost.
async function persistOrders(){
  if(!storageAvailable) return;
  try{
    var latest = null;
    try{
      var result = await window.storage.get(ORDERS_KEY, true);
      if(result && result.value) latest = JSON.parse(result.value);
    }catch(e){ /* key doesn't exist yet */ }
    var mergedOrders = mergeById(latest ? latest.orders : [], state.orders);
    var mergedLogins = mergeLogins(latest ? latest.customerLogins : [], state.customerLogins);
    state.orders = mergedOrders;
    state.customerLogins = mergedLogins;
    await window.storage.set(ORDERS_KEY, JSON.stringify({orders: mergedOrders, customerLogins: mergedLogins}), true);
  }catch(e){
    console.error('Could not save orders to backend storage', e);
  }
}

// Pulls the latest shared data down from storage (used on startup and on manual refresh,
// so changes made by the admin or other customers show up). Read-only — never writes.
async function loadState(){
  state.products = getDefaultProducts();
  if(!storageAvailable) return;
  var seedConfig = false, seedOrders = false;
  try{
    var configResult = await window.storage.get(CONFIG_KEY, true);
    if(configResult && configResult.value){
      applyConfig(JSON.parse(configResult.value));
    } else {
      seedConfig = true;
    }
  }catch(e){
    seedConfig = true; // key doesn't exist yet on the backend
  }
  try{
    var ordersResult = await window.storage.get(ORDERS_KEY, true);
    if(ordersResult && ordersResult.value){
      applyOrders(JSON.parse(ordersResult.value));
    } else {
      seedOrders = true;
    }
  }catch(e){
    seedOrders = true;
  }
  // First run ever on this artifact: seed both keys with the defaults so future reads/writes have something to merge against.
  if(seedConfig) { try{ await persistConfig(); }catch(e2){ console.error('Could not seed config storage', e2); } }
  if(seedOrders) { try{ await persistOrders(); }catch(e2){ console.error('Could not seed orders storage', e2); } }
}

async function refreshFromBackend(){
  if(!storageAvailable){
    showToast('Backend storage isn\'t available in this environment', 'warning');
    return;
  }
  if(isSyncing) return;
  isSyncing = true;
  try{
    var configResult = await window.storage.get(CONFIG_KEY, true);
    if(configResult && configResult.value) applyConfig(JSON.parse(configResult.value));
    var ordersResult = await window.storage.get(ORDERS_KEY, true);
    if(ordersResult && ordersResult.value) applyOrders(JSON.parse(ordersResult.value));
    showToast('Latest data loaded', 'success');
  }catch(e){
    console.error('Could not refresh from backend storage', e);
  } finally {
    isSyncing = false;
    renderApp();
  }
}

function showToast(msg, type){
  type = type || 'success';
  var c = document.getElementById('toast-container');
  var t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.innerHTML = '<span>' + escHtml(msg) + '</span>';
  c.appendChild(t);
  requestAnimationFrame(function(){t.classList.add('show')});
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},350)},3500);
}

function showModal(title, bodyHtml, footerHtml){

  o.classList.add('active');
}
function hideModal(){document.getElementById('modal-overlay').classList.remove('active')}

/* ---------- CART LOGIC ---------- */
function cartCount(){
  return state.cart.reduce(function(sum,i){return sum + i.qty;}, 0);
}
function cartTotal(){
  return state.cart.reduce(function(sum,item){
    var p = state.products.find(function(pr){return pr.id===item.productId;});
    if(!p) return sum;
    return sum + (p.sizes[0].price * item.qty);
  }, 0);
}
function addToCart(productId){
  var existing = state.cart.find(function(i){return i.productId===productId;});
  if(existing){ existing.qty += 1; }
  else{ state.cart.push({productId:productId, qty:1}); }
  showToast('Added to cart!');
  renderApp();
}
function removeFromCart(productId){
  state.cart = state.cart.filter(function(i){return i.productId!==productId;});
  showToast('Removed from cart', 'info');
  renderApp();
}
function changeCartQty(productId, delta){
  var item = state.cart.find(function(i){return i.productId===productId;});
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){
    removeFromCart(productId);
    return;
  }
  renderApp();
}
function setFulfillmentType(type){
  // preserve whatever the customer already typed before we re-render
  var nameInput = document.getElementById('checkout-name');
  var emailInput = document.getElementById('checkout-email');
  var addressInput = document.getElementById('checkout-address');
  var deliveryDayInput = document.getElementById('checkout-delivery-day');
  if(nameInput) state.currentCustomerName = nameInput.value;
  if(emailInput) state.currentCustomerEmail = emailInput.value;
  if(addressInput) state.currentCustomerAddress = addressInput.value;
  if(deliveryDayInput) state.currentCustomerDeliveryDay = deliveryDayInput.value;
  state.checkoutFulfillment = type;
  renderApp();
}
function checkout(){
  if(state.cart.length===0) return;
  var nameInput = document.getElementById('checkout-name');
  var name = nameInput ? nameInput.value.trim() : '';
  if(!name){
    showToast('Enter your name to place your order', 'error');
    return;
  }
  var emailInput = document.getElementById('checkout-email');
  var email = emailInput ? emailInput.value.trim().toLowerCase() : '';
  if(!email || email.indexOf('@')===-1){
    showToast('Enter a valid email to place your order', 'error');
    return;
  }
  var fulfillment = state.checkoutFulfillment === 'delivery' ? 'delivery' : 'pickup';
  var pickupDay = '';
  var address = '';
  var deliveryDay = '';
  if(fulfillment === 'pickup'){
    var pickupInput = document.getElementById('checkout-pickup-day');
    pickupDay = pickupInput ? pickupInput.value : '';
    if(!pickupDay){
      showToast('Choose a pickup day to place your order', 'error');
      return;
    }
  } else {
    var addressInput = document.getElementById('checkout-address');
    address = addressInput ? addressInput.value.trim() : '';
    if(!address){
      showToast('Enter your delivery location to place your order', 'error');
      return;
    }
    var deliveryDayInput = document.getElementById('checkout-delivery-day');
    deliveryDay = deliveryDayInput ? deliveryDayInput.value : '';
    if(!deliveryDay){
      showToast('Choose a delivery day to place your order', 'error');
      return;
    }
  }
  logCustomerLogin(email);
  state.currentCustomerEmail = email;
  state.currentCustomerName = name;
  state.currentCustomerAddress = address;
  state.currentCustomerDeliveryDay = deliveryDay;
  var tracking = genTrackingId();
  var verificationCode = genVerificationCode();
  var newOrder = {
    id: genId(),
    tracking: tracking,
    verificationCode: verificationCode,
    name: name,
    email: email,
    fulfillment: fulfillment, // 'pickup' | 'delivery'
    pickupDay: pickupDay,
    address: address,
    deliveryDay: deliveryDay,
    items: state.cart.slice(),
    total: cartTotal(),
    status: 'pending', // pending | delivered
    paymentStatus: 'awaiting', // awaiting | claimed | confirmed
    date: new Date().toISOString()
  };
  state.orders.push(newOrder);
  state.lastOrder = newOrder;
  state.cart = [];
  state.route = 'thankyou';
  persistOrders();
  renderApp();
}

/* ---------- CUSTOMER LOGIN TRACKING & ORDER STATUS ---------- */
function logCustomerLogin(email){
  state.customerLogins.push({email: email, timestamp: new Date().toISOString()});
}
function loginCountForEmail(email){
  return state.customerLogins.filter(function(l){return l.email===email;}).length;
}
function ordersForEmail(email){
  return state.orders.filter(function(o){return o.email===email;});
}
function toggleOrderStatus(orderId){
  var o = state.orders.find(function(ord){return ord.id===orderId;});
  if(!o) return;
  o.status = o.status==='pending' ? 'delivered' : 'pending';
  showToast('Order marked as ' + o.status, 'success');
  persistOrders();
  renderApp();
}
function markPaymentClaimed(orderId){
  var o = state.orders.find(function(ord){return ord.id===orderId;});
  if(!o) return;
  o.paymentStatus = 'claimed';
  if(state.lastOrder && state.lastOrder.id===orderId) state.lastOrder.paymentStatus = 'claimed';
  showToast('Thanks! We\'ll confirm your payment shortly.', 'success');
  persistOrders();
  renderApp();
}
function confirmPayment(orderId){
  var o = state.orders.find(function(ord){return ord.id===orderId;});
  if(!o) return;
  o.paymentStatus = 'confirmed';
  showToast('Payment confirmed', 'success');
  persistOrders();
  renderApp();
}
function revertPayment(orderId){
  var o = state.orders.find(function(ord){return ord.id===orderId;});
  if(!o) return;
  o.paymentStatus = 'awaiting';
  showToast('Payment status reset', 'info');
  persistOrders();
  renderApp();
}
function trackOrders(){
  var input = document.getElementById('track-email-input');
  var email = input ? input.value.trim().toLowerCase() : '';
  if(!email || email.indexOf('@')===-1){
    showToast('Enter a valid email', 'error');
    return;
  }
  logCustomerLogin(email);
  state.trackEmailInput = email;
  persistOrders();
  renderApp();
}

/* ---------- IMAGE MANAGER (admin add/edit forms) ---------- */
var formImages = []; // working array of base64 data URIs used by both add & edit forms while modal/form open

function renderImgManager(){
  var thumbs = formImages.map(function(url, idx){
    return '<div class="img-thumb"><img src="' + url + '"><div class="img-remove" onclick="removeFormImage(' + idx + ')"><i class="fas fa-times"></i></div></div>';
  }).join('');
  return '<div id="img-manager-thumbs" class="img-manager">' + thumbs + '</div><div class="img-add-row"><label class="btn btn-outline btn-sm" style="cursor:pointer"><i class="fas fa-upload"></i> Upload Photo<input type="file" accept="image/*" multiple style="display:none" onchange="handleImageUpload(event)"></label></div>';
}
function handleImageUpload(event){
  var files = Array.prototype.slice.call(event.target.files || []);
  if(!files.length) return;
  var remaining = files.length;
  files.forEach(function(file){
    var reader = new FileReader();
    reader.onload = function(e){
      formImages.push(e.target.result);
      remaining--;
      if(remaining === 0) refreshImgManager();
    };
    reader.onerror = function(){
      showToast('Could not read one of the images', 'error');
      remaining--;
      if(remaining === 0) refreshImgManager();
    };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}
function removeFormImage(idx){
  formImages.splice(idx, 1);
  refreshImgManager();
}
function refreshImgManager(){
  var el = document.getElementById('img-manager-thumbs');
  var wrap = el.parentElement;
  wrap.outerHTML = renderImgManager();
}

function galleryNav(productId, dir, ev){
  if(ev) ev.stopPropagation();
  var p = state.products.find(function(pr){return pr.id===productId;});
  if(!p || !p.images || p.images.length<2) return;
  var cur = state.galleryIndex[productId] || 0;
  cur = (cur + dir + p.images.length) % p.images.length;
  state.galleryIndex[productId] = cur;
  renderApp();
}

      : '';

    app.innerHTML = nav + body;
    return;
  }

  if(state.route === 'cart'){
    var body;
    if(state.cart.length===0){
      body = '<div class="empty-cart"><i class="fas fa-cart-shopping"></i><p>Your cart is empty.</p><button class="btn btn-dark" style="margin-top:16px" onclick="state.route=\'home\';renderApp();">Browse Products</button></div>';
    } else {
      var rows = state.cart.map(function(item){
        var p = state.products.find(function(pr){return pr.id===item.productId;});
        if(!p) return '';
        var img = (p.images && p.images[0]) ? p.images[0] : '';

      }).join('');

        ? state.pickupDays.map(function(d){return '<option value="'+d+'">'+d+'</option>';}).join('')

function loginAdmin(){
  var pass = document.getElementById('admin-pass').value;
  if(pass === state.adminPassword){
    state.adminAuth = true;
    formImages = [];
    renderApp();
    refreshFromBackend(); // pull the latest data as soon as pilot opens
  } else {
    showToast('Invalid credentials', 'error');
  }
}

function changeAdminPassword(){
  var current = document.getElementById('current-pass-input').value;
  var next = document.getElementById('new-pass-input').value;
  var confirm = document.getElementById('confirm-pass-input').value;
  if(current !== state.adminPassword){
    showToast('Current password is incorrect', 'error');
    return;
  }
  if(!next || next.length < 4){
    showToast('New password must be at least 4 characters', 'error');
    return;
  }
  if(next !== confirm){
    showToast('New passwords do not match', 'error');
    return;
  }
  state.adminPassword = next;
  showToast('Password updated successfully!');
  persistConfig();
  renderApp();
}

function openEditProductModal(id){
  var p = state.products.find(function(item){ return item.id === id; });
  if(!p) return;
  formImages = (p.images || []).slice();

  var sectOptions = state.sections.map(function(s){
    return '<option value="' + escHtml(s) + '" ' + (p.type === s ? 'selected' : '') + '>' + escHtml(s.toUpperCase()) + '</option>';
  }).join('');

  var body = '<div class="form-group"><label>Product Name</label><input type="text" id="edit-p-name" class="form-control" value="' + escHtml(p.name) + '"></div><div class="form-group"><label>Photos</label>' + renderImgManager() + '</div><div class="form-group"><label>Section / Category</label><select id="edit-p-type" class="form-control">' + sectOptions + '</select></div><div class="form-group"><label>Price</label><input type="number" id="edit-p-price" class="form-control" value="' + p.sizes[0].price + '"></div>';
  var footer = '<button class="btn btn-outline" onclick="hideModal()">Cancel</button><button class="btn btn-dark" onclick="saveProductEdits(\'' + p.id + '\')">Save Changes</button>';

  showModal('Edit Product Details', body, footer);
}

function saveProductEdits(id){
  var p = state.products.find(function(item){ return item.id === id; });
  if(p){
    p.name = document.getElementById('edit-p-name').value;
    p.type = document.getElementById('edit-p-type').value;
    p.sizes[0].price = Number(document.getElementById('edit-p-price').value) || p.sizes[0].price;
    p.images = formImages.slice();
    hideModal();
    showToast('Product updated successfully!');
    persistConfig();
    renderApp();
  }
}

function deleteProduct(id){
  state.products = state.products.filter(function(p){return p.id!==id;});
  state.cart = state.cart.filter(function(i){return i.productId!==id;});
  showToast('Product deleted', 'info');
  persistConfig();
  renderApp();
}

function addNewProduct(){
  var name = document.getElementById('new-p-name').value;
  var type = document.getElementById('new-p-type').value;
  var price = document.getElementById('new-p-price').value || 1000;

  if(!name){
    showToast('Product name is required', 'error');
    return;
  }
  if(!type){
    showToast('Add a section first', 'error');
    return;
  }

  state.products.push({
    id: genId(),
    name: name,
    type: type,
    description: 'Delicious and freshly made.',
    images: formImages.slice(),
    sizes: [{label: 'Standard', price: Number(price)}],
    inStock: true,
    featured: false
  });

  formImages = [];
  showToast('New product added successfully!');
  persistConfig();
  renderApp();
}

function addNewSection(){
  var name = document.getElementById('new-section-name').value.trim().toLowerCase();
  if(!name){
    showToast('Section name cannot be empty', 'error');
    return;
  }
  if(state.sections.indexOf(name) !== -1){
    showToast('Section already exists', 'warning');
    return;
  }
  state.sections.push(name);
  showToast('New product section added!');
  persistConfig();
  renderApp();
}

function removeSection(name){
  state.sections = state.sections.filter(function(s){return s!==name;});
  showToast('Section removed', 'info');
  persistConfig();
  renderApp();
}

function savePaymentNumber(){
  var input = document.getElementById('payment-number-input');
  var val = input ? input.value.trim() : '';
  if(!val){
    showToast('Payment number cannot be empty', 'error');
    return;
  }
  state.paymentNumber = val;
  showToast('Payment number updated!');
  persistConfig();
  renderApp();
}

function togglePickupDay(day){
  var idx = state.pickupDays.indexOf(day);
  if(idx === -1){
    state.pickupDays.push(day);
  } else {
    state.pickupDays.splice(idx, 1);
  }
  showToast('Pickup days updated');
  persistConfig();
  renderApp();
}

function toggleDeliveryDay(day){
  var idx = state.deliveryDays.indexOf(day);
  if(idx === -1){
    state.deliveryDays.push(day);
  } else {
    state.deliveryDays.splice(idx, 1);
  }
  showToast('Delivery days updated');
  persistConfig();
  renderApp();
}

// Initializing application state: load shared data from the backend, then render.
loadState().then(function(){
  renderApp();
}).catch(function(e){
  console.error('Startup load failed, running with defaults', e);
  renderApp();
});
</script>
</body>
</html>
